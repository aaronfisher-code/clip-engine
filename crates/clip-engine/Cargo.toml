[package]
name = "clip-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Dabs Clip Engine desktop app"
default-run = "clip-engine"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clip-engine-core = { path = "../clip-engine-core" }
eframe = { version = "0.32", default-features = false, features = ["accesskit", "default_fonts", "wayland", "x11", "glow", "wgpu"] }
egui = "0.32"
glow = "0.16"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
open = "5"
raw-window-handle = "0.6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
wgpu = { version = "25", default-features = false, features = ["dx12", "vulkan", "gles", "wgsl"] }
winit = { version = "0.30", default-features = false, features = ["x11"] }

[build-dependencies]
pkg-config = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "Dabs Clip Engine"
identifier = "dev.dab.clip-engine"
publisher = "Dab"
category = "Video"
out-dir = "../../dist/desktop"
before-packaging-command = "cargo build -p clip-engine --release --bin clip-engine"
formats = ["deb", "appimage", "nsis"]
homepage = "https://github.com/aaronfisher-code/clip-engine"
icons = [
  "assets/icons/32x32.png",
  "assets/icons/64x64.png",
  "assets/icons/128x128.png",
  "assets/icons/128x128@2x.png",
  "assets/clip-engine.png",
  "assets/clip-engine.ico",
]
resources = [
  { src = "../../resources/binaries", target = "binaries" },
  { src = "../../resources/binaries/*.dll", target = "." },
  { src = "../../resources/binaries/*.so*", target = "." },
  { src = "../../resources/THIRD_PARTY_NOTICES.md", target = "THIRD_PARTY_NOTICES.md" },
]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
installer-icon = "assets/clip-engine.ico"

[package.metadata.packager.appimage]
libs = ["libmpv.so.2"]

[package.metadata.packager.deb]
depends = ["libmpv2 | libmpv1"]
