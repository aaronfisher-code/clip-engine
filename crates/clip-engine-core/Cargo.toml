[package]
name = "clip-engine-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Local library, FFmpeg export, and Cloudflare client for Dabs Clip Engine"

[dependencies]
anyhow = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clip-engine-recorder-protocol = { path = "../clip-engine-recorder-protocol" }
interprocess = "2.4.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
pbkdf2 = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
