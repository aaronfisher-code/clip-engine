[package]
name = "clip-engine-recorder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Isolated libobs-backed screen recorder service for Dabs Clip Engine"

[features]
default = []
obs = ["dep:libobs-wrapper"]

[dependencies]
anyhow = "1"
clip-engine-recorder-protocol = { path = "../clip-engine-recorder-protocol" }
display-info = "0.5.9"
global-hotkey = "0.8.0"
interprocess = "2.4.3"
libc = "0.2"
notify-rust = "4"
# Cargo ignores semver build metadata; the lockfile pins the published
# libobs-rs release that targets the 32.0 OBS API.
libobs-wrapper = { version = "=9.0.4", default-features = false, features = ["enable_runtime"], optional = true }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
