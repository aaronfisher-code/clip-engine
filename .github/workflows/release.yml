name: Desktop release

on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump when publishing from the release branch
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (
        github.ref == 'refs/heads/release' &&
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, 'chore(release):')
      )
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      draft: ${{ steps.plan.outputs.draft }}
      apply: ${{ steps.plan.outputs.apply }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: plan
        env:
          BUMP_INPUT: ${{ github.event.inputs.bump }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "version=${version}" >> "${GITHUB_OUTPUT}"
            echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "draft=true" >> "${GITHUB_OUTPUT}"
            echo "apply=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${GITHUB_REF}" != refs/heads/release ]]; then
            echo "Automatic publishing only runs on the release branch. Push a v* tag for a draft, or push to release." >&2
            exit 1
          fi

          bump="${BUMP_INPUT:-patch}"
          if [[ "${COMMIT_MESSAGE}" == *"[major]"* ]]; then
            bump=major
          elif [[ "${COMMIT_MESSAGE}" == *"[minor]"* ]]; then
            bump=minor
          fi

          latest_tag="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1 || true)"
          version="$(node scripts/desktop-version.mjs next --bump "${bump}" --latest-tag "${latest_tag}")"
          tag="v${version}"
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "draft=false" >> "${GITHUB_OUTPUT}"
          echo "apply=true" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${tag} (${bump})"

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            formats: deb,appimage
            archive: ffmpeg-master-latest-linux64-gpl.tar.xz
          - platform: windows-2025
            formats: nsis
            archive: ffmpeg-master-latest-win64-gpl.zip
    runs-on: ${{ matrix.platform }}
    env:
      OBS_RUNTIME_URL: ${{ runner.os == 'Windows' && (secrets.OBS_RUNTIME_URL_WINDOWS || secrets.OBS_RUNTIME_URL) || (secrets.OBS_RUNTIME_URL_LINUX || secrets.OBS_RUNTIME_URL) }}
      OBS_RUNTIME_SHA256: ${{ runner.os == 'Windows' && (secrets.OBS_RUNTIME_SHA256_WINDOWS || secrets.OBS_RUNTIME_SHA256) || (secrets.OBS_RUNTIME_SHA256_LINUX || secrets.OBS_RUNTIME_SHA256) }}
      OBS_LIBOBS_PATH: ${{ secrets.OBS_LIBOBS_PATH }}
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Apply release version
        if: needs.prepare.outputs.apply == 'true'
        run: node scripts/desktop-version.mjs set ${{ needs.prepare.outputs.version }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev libobs-dev obs-plugins pkg-config libgtk-3-dev libappindicator3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev patchelf xz-utils fuse libfuse2
      - run: npm ci
      - run: npm run check
      - name: Prepare pinned OBS runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OBS_RUNTIME_URL}" || { echo "A platform-specific OBS_RUNTIME_URL secret is required"; exit 1; }
          [[ "${OBS_RUNTIME_SHA256}" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "A platform-specific OBS_RUNTIME_SHA256 secret is required"; exit 1; }
          node scripts/prepare-libobs-runtime.mjs
      - name: Bundle Linux PipeWire application audio plugin
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d resources/obs/lib/obs-plugins ]]; then
            plugin_dir="resources/obs/lib/obs-plugins"
            data_dir="resources/obs/share/obs"
          else
            plugin_dir="resources/obs/obs-plugins"
            data_dir="resources/obs/data"
          fi
          plugin="${plugin_dir}/linux-pipewire-audio.so"
          if [[ ! -f "${plugin}" ]]; then
            source_plugin=""
            for candidate in \
              /usr/lib/obs-plugins/linux-pipewire-audio.so \
              /usr/lib64/obs-plugins/linux-pipewire-audio.so \
              "/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/obs-plugins/linux-pipewire-audio.so"; do
              if [[ -f "${candidate}" ]]; then
                source_plugin="${candidate}"
                break
              fi
            done
            test -n "${source_plugin}" || {
              echo "The Linux OBS package did not provide linux-pipewire-audio.so"
              exit 1
            }
            mkdir -p "${plugin_dir}"
            cp "${source_plugin}" "${plugin}"
            if [[ -d /usr/share/obs/obs-plugins/linux-pipewire-audio ]]; then
              mkdir -p "${data_dir}/obs-plugins/linux-pipewire-audio"
              cp -a /usr/share/obs/obs-plugins/linux-pipewire-audio/. \
                "${data_dir}/obs-plugins/linux-pipewire-audio/"
            fi
          fi
          test -f "${plugin}"
      - name: Configure Windows libobs import path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:OBS_LIBOBS_PATH) { throw "OBS_LIBOBS_PATH secret is required for the Windows recorder build" }
          "LIBOBS_PATH=$env:OBS_LIBOBS_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Bundle FFmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p resources/binaries /tmp/clip-engine-ffmpeg
          curl --fail --location "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${{ matrix.archive }}" --output /tmp/clip-engine-ffmpeg/archive.tar.xz
          curl --fail --location "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/checksums.sha256" --output /tmp/clip-engine-ffmpeg/checksums.sha256
          expected=$(grep " ${{ matrix.archive }}$" /tmp/clip-engine-ffmpeg/checksums.sha256 | cut -d ' ' -f 1)
          test -n "$expected"
          echo "$expected  /tmp/clip-engine-ffmpeg/archive.tar.xz" | sha256sum --check --strict
          tar -xf /tmp/clip-engine-ffmpeg/archive.tar.xz -C /tmp/clip-engine-ffmpeg
          cp /tmp/clip-engine-ffmpeg/ffmpeg-*/bin/ffmpeg resources/binaries/ffmpeg
          cp /tmp/clip-engine-ffmpeg/ffmpeg-*/bin/ffprobe resources/binaries/ffprobe
          chmod 755 resources/binaries/ffmpeg resources/binaries/ffprobe
          libdir="$(pkg-config --variable=libdir mpv)"
          cp -L "${libdir}/libmpv.so.2" resources/binaries/libmpv.so.2
          test -s resources/binaries/libmpv.so.2
      - name: Bundle FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force resources/binaries, $env:RUNNER_TEMP/clip-engine-ffmpeg | Out-Null
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${{ matrix.archive }}" -OutFile "$env:RUNNER_TEMP/clip-engine-ffmpeg/archive.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/checksums.sha256" -OutFile "$env:RUNNER_TEMP/clip-engine-ffmpeg/checksums.sha256"
          $archive = "${{ matrix.archive }}"
          $line = Select-String -Path "$env:RUNNER_TEMP/clip-engine-ffmpeg/checksums.sha256" -Pattern " $([regex]::Escape($archive))$"
          if (-not $line) { throw "FFmpeg checksum was not published" }
          $expected = $line.Line.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0].ToLowerInvariant()
          $actual = (Get-FileHash "$env:RUNNER_TEMP/clip-engine-ffmpeg/archive.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg checksum mismatch" }
          Expand-Archive "$env:RUNNER_TEMP/clip-engine-ffmpeg/archive.zip" "$env:RUNNER_TEMP/clip-engine-ffmpeg/unpacked"
          Copy-Item "$env:RUNNER_TEMP/clip-engine-ffmpeg/unpacked/ffmpeg-*/bin/ffmpeg.exe" resources/binaries/ffmpeg.exe
          Copy-Item "$env:RUNNER_TEMP/clip-engine-ffmpeg/unpacked/ffmpeg-*/bin/ffprobe.exe" resources/binaries/ffprobe.exe
      - name: Bundle libmpv on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Headers @{ 'User-Agent' = 'clip-engine-ci' } https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -like 'mpv-dev-x86_64-*' -and $_.name -like '*.7z' } | Select-Object -First 1
          if (-not $asset) { throw 'mpv-dev asset missing' }
          Invoke-WebRequest $asset.browser_download_url -OutFile "$env:RUNNER_TEMP/mpv-dev.7z"
          7z x "$env:RUNNER_TEMP/mpv-dev.7z" -o"$env:RUNNER_TEMP/mpv-dev"
          & scripts/windows-mpv-msvc-lib.ps1 -ExtractDir "$env:RUNNER_TEMP/mpv-dev" -DllDestination "resources/binaries/mpv-2.dll"
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build release binary
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo build -p clip-engine-recorder --release --features obs --bin clip-engine-recorder
          cargo build -p clip-engine --release --bin clip-engine
      - name: Test Windows recorder and endpoint discovery
        if: runner.os == 'Windows'
        run: |
          cargo test -p clip-engine-recorder-protocol
          cargo test -p clip-engine-recorder --features obs
      - name: Confirm release binary
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            bin="${CARGO_TARGET_DIR}/release/clip-engine.exe"
          else
            bin="${CARGO_TARGET_DIR}/release/clip-engine"
          fi
          ls -la "${CARGO_TARGET_DIR}/release"
          test -f "${bin}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            test -f "${CARGO_TARGET_DIR}/release/clip-engine-recorder.exe"
          else
            test -f "${CARGO_TARGET_DIR}/release/clip-engine-recorder"
          fi
      - name: Smoke-test bundled recorder runtime on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CLIP_ENGINE_RECORDER: ${{ github.workspace }}/target/release/clip-engine-recorder
          CLIP_ENGINE_OBS_ROOT: ${{ github.workspace }}/resources/obs
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="${CLIP_ENGINE_OBS_ROOT}/lib:${CLIP_ENGINE_OBS_ROOT}/bin/64bit:${LD_LIBRARY_PATH:-}"
          node scripts/smoke-recorder.mjs
      - name: Smoke-test bundled recorder runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CLIP_ENGINE_RECORDER: ${{ github.workspace }}/target/release/clip-engine-recorder.exe
          CLIP_ENGINE_OBS_ROOT: ${{ github.workspace }}/resources/obs
        run: |
          $env:PATH = "$env:CLIP_ENGINE_OBS_ROOT\bin\64bit;$env:CLIP_ENGINE_OBS_ROOT\bin;$env:PATH"
          node scripts/smoke-recorder.mjs
      - name: Package
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUXDEPLOY_EXCLUDED_LIBRARIES: libxkbcommon.so.0;libxkbcommon-x11.so.0
        run: cargo packager -p clip-engine --release --formats ${{ matrix.formats }}
      - name: Reject bundled XKB libraries
        if: runner.os == 'Linux'
        run: bash scripts/assert-appimage-xkb.sh dist/desktop
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/desktop/**
          if-no-files-found: error

  publish:
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tag the shipped version
        if: needs.prepare.outputs.apply == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/desktop-version.mjs set "${VERSION}"
          git add Cargo.toml Cargo.lock package.json package-lock.json cloud/package.json packages/contracts/package.json
          git commit -m "chore(release): ${TAG}"
          git tag "${TAG}"
          git push origin "${TAG}"
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::warning::Could not update ${GITHUB_REF_NAME}; ${TAG} was still pushed."
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist/desktop
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Dabs Clip Engine ${{ needs.prepare.outputs.tag }}
          draft: ${{ needs.prepare.outputs.draft == 'true' }}
          make_latest: ${{ needs.prepare.outputs.draft != 'true' }}
          generate_release_notes: true
          files: dist/desktop/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
