name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: --bundles appimage,deb
            archive: ffmpeg-master-latest-linux64-gpl.tar.xz
          - platform: windows-2025
            args: --bundles nsis
            archive: ffmpeg-master-latest-win64-gpl.zip
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xz-utils
      - run: npm ci
      - run: npm run check
      - name: Bundle FFmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries /tmp/clip-engine-ffmpeg
          curl --fail --location "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${{ matrix.archive }}" --output /tmp/clip-engine-ffmpeg/archive.tar.xz
          curl --fail --location "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/checksums.sha256" --output /tmp/clip-engine-ffmpeg/checksums.sha256
          expected=$(grep " ${{ matrix.archive }}$" /tmp/clip-engine-ffmpeg/checksums.sha256 | cut -d ' ' -f 1)
          test -n "$expected"
          echo "$expected  /tmp/clip-engine-ffmpeg/archive.tar.xz" | sha256sum --check --strict
          tar -xf /tmp/clip-engine-ffmpeg/archive.tar.xz -C /tmp/clip-engine-ffmpeg
          cp /tmp/clip-engine-ffmpeg/ffmpeg-*/bin/ffmpeg src-tauri/binaries/ffmpeg
          cp /tmp/clip-engine-ffmpeg/ffmpeg-*/bin/ffprobe src-tauri/binaries/ffprobe
          chmod 755 src-tauri/binaries/ffmpeg src-tauri/binaries/ffprobe
      - name: Bundle FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries, $env:RUNNER_TEMP/clip-engine-ffmpeg | Out-Null
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${{ matrix.archive }}" -OutFile "$env:RUNNER_TEMP/clip-engine-ffmpeg/archive.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/checksums.sha256" -OutFile "$env:RUNNER_TEMP/clip-engine-ffmpeg/checksums.sha256"
          $archive = "${{ matrix.archive }}"
          $line = Select-String -Path "$env:RUNNER_TEMP/clip-engine-ffmpeg/checksums.sha256" -Pattern " $([regex]::Escape($archive))$"
          if (-not $line) { throw "FFmpeg checksum was not published" }
          $expected = $line.Line.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0].ToLowerInvariant()
          $actual = (Get-FileHash "$env:RUNNER_TEMP/clip-engine-ffmpeg/archive.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg checksum mismatch" }
          Expand-Archive "$env:RUNNER_TEMP/clip-engine-ffmpeg/archive.zip" "$env:RUNNER_TEMP/clip-engine-ffmpeg/unpacked"
          Copy-Item "$env:RUNNER_TEMP/clip-engine-ffmpeg/unpacked/ffmpeg-*/bin/ffmpeg.exe" src-tauri/binaries/ffmpeg.exe
          Copy-Item "$env:RUNNER_TEMP/clip-engine-ffmpeg/unpacked/ffmpeg-*/bin/ffprobe.exe" src-tauri/binaries/ffprobe.exe
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CONFIG: '{"plugins":{"updater":{"pubkey":"${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}"}}}'
        with:
          tagName: v__VERSION__
          releaseName: Clip Engine v__VERSION__
          releaseBody: Windows and Linux installers plus signed automatic-update artifacts.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
