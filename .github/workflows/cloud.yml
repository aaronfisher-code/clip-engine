name: Cloud deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm --workspace @clip-engine/cloud exec -- wrangler d1 migrations apply clip-engine-prod --remote
      - run: npm --workspace @clip-engine/cloud exec -- wrangler deploy
      - run: npm --workspace @clip-engine/cloud exec -- wrangler r2 bucket lifecycle set clip-engine-media-prod --file lifecycle.json --force
