name: CI

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run format:rust
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build -p clip-engine
