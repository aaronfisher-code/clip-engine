name: CI

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      OBS_RUNTIME_URL: https://github.com/obsproject/obs-studio/releases/download/32.0.4/OBS-Studio-32.0.4-Ubuntu-24.04-x86_64.deb
      OBS_RUNTIME_SHA256: b146f22a34888bb9854bd7574fc949b00043ba38d222da13f71c180050bf289b
      OBS_RUNTIME_ARCHIVE: target/obs-runtime.deb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' |
              sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y \
            libmpv-dev libobs-dev obs-plugins pkg-config libgtk-3-dev \
            libappindicator3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev \
            libsrt1.5-openssl libmbedtls14t64 libv4l-0
      - run: npm ci
      - name: Validate recorder scripts
        run: node --check scripts/prepare-libobs-runtime.mjs && node --check scripts/probe-recorder.mjs && node --check scripts/smoke-recorder.mjs
      - name: Prepare pinned OBS runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-libobs-runtime.mjs
          test -f resources/obs/lib/libobs.so
          echo "LIBOBS_PATH=${GITHUB_WORKSPACE}/resources/obs/lib" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${GITHUB_WORKSPACE}/resources/obs/lib:${GITHUB_WORKSPACE}/resources/obs/bin/64bit:${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"
      - run: npm run check
      - run: npm test
      - run: npm run format:rust
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p clip-engine-recorder-protocol -p clip-engine-recorder
      - run: cargo test -p clip-engine-recorder --features obs
      - run: cargo check -p clip-engine-recorder --features obs
      - run: cargo build -p clip-engine
      - run: cargo build -p clip-engine-recorder --features obs
